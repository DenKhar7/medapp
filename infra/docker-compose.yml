services:
  jenkins:
    image: jenkins/jenkins:lts
    restart: always
    user: jenkins
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - backend

volumes:
  jenkins_home:

networks:
  backend:
    driver: bridge
    name: backend
