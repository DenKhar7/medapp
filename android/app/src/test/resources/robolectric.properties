# Configuration par défaut de Robolectric pour tous les tests unitaires.
#
# On utilise une Application vide à la place de MedicAppApplication : celle-ci planifie un Worker dans
# onCreate(), or WorkManager n'est pas initialisé dans la JVM de test ("WorkManager is not initialized
# properly"), ce qui faisait échouer tous les tests Robolectric.
application=android.app.Application
sdk=31
